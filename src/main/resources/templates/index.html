<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Spring Boot Form Demo</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 40px;">

<h2>Student Information Form</h2>

<!-- Form sends POST request to /submit -->
<form action="/submit" method="post">
    <label for="studentName">Enter Your Name:</label><br><br>
    <input type="text" id="studentName" name="userName" placeholder="e.g. harry" required style="padding: 6px; width: 250px;">
    <button type="submit" style="padding: 6px 12px; cursor: pointer;">Submit</button>
</form>

<hr style="margin-top: 30px;">

<!-- This section only appears if submittedName exists -->
<div th:if="${submittedName != null}">
    <h3>Form Submitted Successfully!</h3>
    <p>Hello, <strong th:text="${submittedName}"></strong>! Your data was received by Spring Boot.</p>
</div>

</body>
</html>
